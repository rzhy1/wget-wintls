name: wget-for-windows CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    strategy:
      matrix:
        ftype: [wintls-static-lite, openssl-lite]
      fail-fast: false
    name: wget-${{ matrix.ftype }}
    runs-on: windows-2025-vs2026
    env:
      msystem: UCRT64
      build_type: ${{ matrix.ftype }}
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Restore last upstream SHA cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-

      - id: check_upstream
        name: Check upstream changes
        shell: bash
        run: |
          mkdir -p .cache

          git clone --depth=1 https://github.com/lifenjoiner/wget-for-windows.git tmprepo
          NEW_SHA=$(cd tmprepo && git rev-parse HEAD)
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "Found upstream NEW_SHA=$NEW_SHA"

          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          echo "Found cached OLD_SHA=$OLD_SHA"

          if [ "${FORCE_BUILD}" = "1" ]; then
            echo "FORCE_BUILD=1 -> 强制编译"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "No upstream changes, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NEW_SHA" > .cache/last_sha
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - id: envs
        name: Set up ENVs for MSYS2 to inherit
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        shell: bash
        run: |
          BRoot="${PWD}"
          BDir="build/${build_type}/${msystem}"
          CDir="${BDir}-config"
          echo "BRoot=$BRoot" >> "$GITHUB_ENV"
          echo "BDir=$BDir"   >> "$GITHUB_ENV"
          echo "CDir=$CDir"   >> "$GITHUB_ENV"
          echo "cdir=$CDir"   >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ env.msystem }}
          release: true
          path-type: inherit
          install: >-
            pkgconf
            gperf
            base-devel
            autoconf-archive
            autoconf
            automake
            git
            texinfo
            gettext
            gettext-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gettext
            ${{ matrix.ftype == 'openssl-lite' && 'mingw-w64-ucrt-x86_64-openssl' || '' }}

      - name: Clone wget repository
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: git clone --branch mydev https://github.com/lifenjoiner/wget-for-windows.git wget

      - name: Generate configure
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          cd wget
          if [ -d "gnulib" ]; then
            rm -rf gnulib
          fi
          git clone --depth=1 https://github.com/coreutils/gnulib.git
          ./bootstrap --skip-po --gnulib-srcdir=gnulib
          sed -i "s/-dirty\b//p" configure

      - name: Install win-iconv (Build)
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          git clone -j$(nproc) https://github.com/win-iconv/win-iconv.git win-iconv
          cd win-iconv
          cmake -G "MSYS Makefiles" \
            -D WIN_ICONV_BUILD_SHARED=OFF \
            -D DISABLE_LOCALE_CHARSET=ON \
            -D CMAKE_INSTALL_PREFIX=$MINGW_PREFIX .
          make -E CFLAGS=-Os prefix=$MINGW_PREFIX install
          cd ..

      - name: configure
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          mkdir -p $BDir
          mkdir -p $CDir
          cd $CDir
          export CFLAGS+="-DGNULIB_defined_ESOCK"
          if [ "${{ matrix.ftype }}" = "wintls-static-lite" ]; then
            CFLAGS+=" -D_WIN32_WINNT=0x0A00 -Os" LDFLAGS="-static -s" $BRoot/wget/configure --prefix=$BRoot/$BDir --disable-debug --disable-rpath --disable-nls --without-libpsl --without-metalink --disable-pcre --disable-pcre2 --with-winidn --enable-threads=windows
          elif [ "${{ matrix.ftype }}" = "openssl-lite" ]; then
            CFLAGS+=" -Os" LDFLAGS="-static -s" $BRoot/wget/configure --prefix=$BRoot/$BDir --with-ssl=openssl --disable-debug --disable-rpath --disable-nls --without-libpsl --without-metalink --disable-pcre --disable-pcre2 --with-winidn --enable-threads=windows
          fi

      - name: Build
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          cd $CDir
          echo -e "all:\n\n" > gnulib_po/Makefile
          make -j$(nproc)
          cp -fv ${PWD}/src/wget.exe ${PWD}/src/wget-${{ matrix.ftype }}.exe

      - id: info
        name: Show compiled wget info
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          ls -l $CDir/src/wget-${{ matrix.ftype }}.exe
          SHA=$(sha1sum $CDir/src/wget-${{ matrix.ftype }}.exe | cut -b 1-40)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          $CDir/src/wget -V

      - name: Upload wget
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: wget-${{ env.msystem }}-${{ env.build_type }}_${{ steps.info.outputs.sha }}
          path: ${{ steps.envs.outputs.cdir }}/src/wget-${{ matrix.ftype }}.exe

      - name: Get version number
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          VERSION=$(cat ${{ env.CDir }}/.version)
          echo "wget_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create Release
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: wget-${{ env.wget_VERSION }}
          allowUpdates: true
          artifacts: "${{ env.CDir }}/src/wget-${{ matrix.ftype }}.exe"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save last upstream SHA to cache
        if: ${{ steps.check_upstream.outputs.skip == 'false' }}
        uses: actions/cache@v5
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check_upstream.outputs.new_sha }}
